{% extends 'base.html' %}
{% load static %}
{% block title %}Inicio{% endblock %}
{% block content %}
<div class="row">
  {% for tema in temas %}
  <div class="col-md-6">
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ tema.nombre }}</h5>
        <p class="card-text">{{ tema.descripcion }}</p>
        <a href="{% url 'inicio_godoy:detalle_tema' tema.id %}" class="btn btn-primary">Ver más</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
